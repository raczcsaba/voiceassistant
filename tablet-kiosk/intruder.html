<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behatolás</title>
<style>
  /* Full-screen alert the kiosks show when someone is home while you are away. Pulses (about 1 Hz, no hard strobe). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e00000; color: #fff;
    font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .glow { position: fixed; inset: 0; animation: pulse 1.1s ease-in-out infinite alternate;
    background: radial-gradient(ellipse at center, #ff4040 0%, #ff0000 55%, #d80000 100%); }
  .sweep { position: fixed; inset: -50%; animation: spin 3.2s linear infinite; opacity: .22;
    background: conic-gradient(from 0deg, transparent 0 300deg, rgba(255,255,255,.9) 340deg, transparent 360deg); }
  @keyframes pulse { from { opacity: .7; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6vmin; gap: 2.5vmin; text-shadow: 0 .3vmin 1.5vmin rgba(90,0,0,.55); }
  .icon { font-size: 22vmin; line-height: 1; animation: bob 1.1s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: scale(1.08); } }
  h1 { margin: 0; font-size: 11vmin; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
  p { margin: 0; font-size: 5vmin; font-weight: 400; max-width: 80vmin; }
  .rec { display: inline-flex; align-items: center; gap: 1.5vmin; font-size: 4vmin; font-weight: 600; letter-spacing: .2em;
    padding: 1.5vmin 3.5vmin; border-radius: 999px; background: rgba(120,0,0,.45); }
  .dot { width: 2.6vmin; height: 2.6vmin; border-radius: 50%; background: #fff; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  time { font-size: 4vmin; opacity: .85; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="glow"></div><div class="sweep"></div>
<main>
  <div class="icon">🚨</div>
  <h1>Behatolás észlelve</h1>
  <p>A tulajdonost értesítettük. Mosolyogj, kamera rögzít.</p>
  <span class="rec"><span class="dot"></span>REC</span>
  <time id="t"></time>
</main>
<script>
  const t = document.getElementById("t");
  const tick = () => { t.textContent = new Date().toLocaleTimeString("hu-HU"); };
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
