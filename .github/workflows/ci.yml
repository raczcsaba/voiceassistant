name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Only what the tests need: MLX, the speech models and the audio stack are macOS-only and never imported.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check the Lovelace cards
        run: for f in $(git ls-files '*.js'); do node --check "$f"; done
